<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>exibir e esconder listas</title>

    <style>
.escondido{
    display: none;
}
 button{
 margin-bottom: 10px;
 padding: 5px 10px;
 cursor: pointer;
 }
    </style>
       

</head>
<body>
   <h1>minhas listas</h1> 
 
   <button id="botao-listas">esconder tudo</button> 

   <h2>frutas</h2>
   <ul id="lista-frutas">
       <li>banana</li>
       <li>maçã</li>
       <li>laranja</li>
    </ul>

    <script>
        const botaoListas = document.getElementById('botao-listas');
        const listaFrutas = document.getElementById('lista-frutas');

        botaoListas.addEventListener('click', () => {
            if (listaFrutas.style.display === 'none') {
                listaFrutas.style.display = 'block';
                botaoListas.textContent = 'esconder tudo';
            } else {
                listaFrutas.style.display = 'none';
                botaoListas.textContent = 'mostrar tudo';
            }
        });
    </script>
</body>
</html>
